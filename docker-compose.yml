# Standalone jump-host deployment. For the unified stack, see theta42/theta-env
# (this same service, gated behind the `jump-host` compose profile).
#
# Supply config either by bind-mounting a secrets file at
# /config/jump-secrets.js (the entrypoint picks it up) or via app_* env vars.

services:
  jump-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${JUMP_GIT_COMMIT:-}
    container_name: jump-host
    restart: unless-stopped
    ports:
      - "${JUMP_SSH_PORT:-2222}:${JUMP_SSH_PORT:-2222}"   # SSH front door
      - "${JUMP_WEB_BIND:-0.0.0.0}:${JUMP_WEB_PORT:-3002}:3002"  # web UI/API
    environment:
      - NODE_ENV=production
      # Host keys persist across rebuilds at the mounted path; the conf default
      # already points here, but pin it explicitly so a conf change cannot
      # silently redirect keys to an unmounted dir.
      - app_ssh__hostKeyPath=/var/lib/jump-host/keys
      - ./config:/config:ro       # optional: jump-secrets.js
      - ./.persist/jump-host:/var/lib/jump-host   # host keys persist across rebuilds
